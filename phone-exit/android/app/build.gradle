plugins { id 'com.android.application' }
android {
    buildFeatures { buildConfig true }
    namespace 'net.phoneexit'
    compileSdk 35
    defaultConfig {
        applicationId 'net.phoneexit'
        testInstrumentationRunner 'net.phoneexit.ControlDirectInstrumentation'
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName '0.7.7'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    if (project.hasProperty('personalAssetsDir')) { sourceSets.main.assets.srcDir(project.property('personalAssetsDir')) }
}
dependencies { implementation 'io.github.webrtc-sdk:android:150.7871.01' }
